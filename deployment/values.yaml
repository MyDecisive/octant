serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: "octant"
  integrationSecretNames:
    - "mdai-datadog-integration"
    - "mdai-argocd-integration"

auth:
  # ServiceAccount that RPC callers mint tokens for (e.g. `kubectl create token`)
  # to authenticate to the octant API. Distinct from serviceAccount.name, which
  # is the identity octant itself runs as.
  clientServiceAccountName: "octant-client"
  # Subjects allowed to mint tokens for the client ServiceAccount above.
  tokenIssuerSubjects:
    - kind: Group
      name: octant-users
      apiGroup: rbac.authorization.k8s.io

deployment:
  name: octant
  replicas: 1
  port: 5678
  tolerations: []
  nodeSelector: {}
  affinity: {}
  annotations: {}
  prometheusEndpoint: "http://kube-prometheus-stack-prometheus:9090"

image:
  repository: ghcr.io/mydecisive/octant
  # tag: latest

argoCD:
  namespace: argocd

certManager:
  version: v1.19.1
  namespace: cert-manager

validator:
  version: 0.1.3

services:
  name: octant
  type: ClusterIP

clarity:
  default:
    logSamplingRatio: 100
    logIncludeErr: true
    traceSamplingRatio: 100
    traceIncludeErr: true
